services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: internkim
      POSTGRES_DB: blueclaw
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${HOST_STATE_DIRECTORY}/secrets/postgres-password:/run/secrets/postgres-password:ro
      - ./01-buzz.sql:/docker-entrypoint-initdb.d/01-buzz.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "internkim", "-d", "blueclaw"]
      interval: 3s
      timeout: 5s
      retries: 40

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: service:postgres
    command: ["redis-server", "--bind", "127.0.0.1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40

  # versitygw serves the bucket directory as-is, so the bucket is `install -d`
  # and no client creates it. --versioning-dir is deliberately absent; see
  # TestBuzzMediaUnitDoesNotEnableVersioning.
  media:
    image: ${HOST_IMAGE}
    restart: unless-stopped
    network_mode: service:postgres
    command:
      - /bin/sh
      - -c
      - 'install -d -m 0750 /data/buzz-media && exec versitygw --port 127.0.0.1:9000 --health /_health posix /data'
    environment:
      ROOT_ACCESS_KEY_ID: ${MEDIA_ACCESS_KEY}
      ROOT_SECRET_ACCESS_KEY: ${MEDIA_SECRET_KEY}
    volumes:
      - media-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/_health"]
      interval: 3s
      timeout: 5s
      retries: 40

  messenger:
    image: ${BUZZ_IMAGE}
    restart: unless-stopped
    network_mode: service:postgres
    environment:
      DATABASE_URL: ${BUZZ_DATABASE_URL}
      BUZZ_DB_POOL_SIZE: "50"
      REDIS_URL: redis://127.0.0.1:6379
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_BIND_ADDR: 127.0.0.1:3000
      BUZZ_HEALTH_PORT: "8081"
      RELAY_URL: ws://localhost:3000
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY}
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      RELAY_OWNER_PUBKEY: ${RELAY_OWNER_PUBKEY}
      BUZZ_S3_ENDPOINT: http://127.0.0.1:9000
      BUZZ_S3_ACCESS_KEY: ${MEDIA_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${MEDIA_SECRET_KEY}
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_S3_REGION: us-east-1
      BUZZ_MEDIA_BASE_URL: http://localhost:3000/media
    depends_on:
      redis:
        condition: service_healthy
      media:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/_readiness"]
      interval: 5s
      timeout: 5s
      retries: 40

  agent:
    image: ${HOST_IMAGE}
    restart: unless-stopped
    network_mode: service:postgres
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      INTERNKIM_APP_URL: ${INTERNKIM_APP_URL}
      GATEWAY_URL: ${GATEWAY_URL}
      CHATD_BOT_USER_NAME: internkim
      MESSENGER_PLATFORM: buzz
      CHATD_BUZZ_RELAY_URL: ws://localhost:3000
      CHATD_BUZZ_PRIVATE_KEY: ${CHATD_BUZZ_PRIVATE_KEY}
    volumes:
      - ${HOST_STATE_DIRECTORY}/secrets:/root/.internkim/secrets:ro
      - workspace:/workspace
      - agent-state:/var/lib/internkim
      - admin-state:/root/.internkim/state
    depends_on:
      messenger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/admin/api/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 40

volumes:
  postgres-data:
  redis-data:
  media-data:
  workspace:
  agent-state:
  admin-state:
