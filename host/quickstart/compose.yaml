services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: internkim
      POSTGRES_DB: blueclaw
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${HOST_STATE_DIRECTORY}/secrets/postgres-password:/run/secrets/postgres-password:ro
      - ./01-buzz.sql:/docker-entrypoint-initdb.d/01-buzz.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "internkim", "-d", "blueclaw"]
      interval: 3s
      timeout: 5s
      retries: 40

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: service:postgres
    command: ["redis-server", "--bind", "127.0.0.1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40

  media:
    image: minio/minio:latest
    restart: unless-stopped
    network_mode: service:postgres
    command: ["server", "/data", "--address", "127.0.0.1:9000", "--console-address", "127.0.0.1:9001"]
    environment:
      MINIO_ROOT_USER: ${MEDIA_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MEDIA_SECRET_KEY}
    volumes:
      - media-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 40

  prepare-media:
    image: minio/mc:latest
    network_mode: service:postgres
    environment:
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'mc alias set company http://127.0.0.1:9000 "$$MEDIA_ACCESS_KEY" "$$MEDIA_SECRET_KEY" && mc mb --ignore-existing company/buzz-media'
    depends_on:
      media:
        condition: service_healthy

  messenger:
    image: ${BUZZ_IMAGE}
    restart: unless-stopped
    network_mode: service:postgres
    environment:
      DATABASE_URL: ${BUZZ_DATABASE_URL}
      REDIS_URL: redis://127.0.0.1:6379
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_BIND_ADDR: 127.0.0.1:3000
      BUZZ_HEALTH_PORT: "8081"
      RELAY_URL: ws://localhost:3000
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY}
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      RELAY_OWNER_PUBKEY: ${RELAY_OWNER_PUBKEY}
      BUZZ_S3_ENDPOINT: http://127.0.0.1:9000
      BUZZ_S3_ACCESS_KEY: ${MEDIA_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${MEDIA_SECRET_KEY}
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_S3_REGION: us-east-1
      BUZZ_MEDIA_BASE_URL: http://localhost:3000/media
    depends_on:
      redis:
        condition: service_healthy
      prepare-media:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/_readiness"]
      interval: 5s
      timeout: 5s
      retries: 40

  agent:
    image: ${HOST_IMAGE}
    restart: unless-stopped
    network_mode: service:postgres
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      INTERNKIM_APP_URL: ${INTERNKIM_APP_URL}
      GATEWAY_URL: ${GATEWAY_URL}
      CHATD_BOT_USER_NAME: internkim
      MESSENGER_PLATFORM: buzz
      CHATD_BUZZ_RELAY_URL: ws://localhost:3000
      CHATD_BUZZ_PRIVATE_KEY: ${CHATD_BUZZ_PRIVATE_KEY}
      CHATD_BUZZ_ACCOUNT_LINKS_PATH: /var/lib/internkim/buzz-account-links.json
      BUZZ_DATABASE_URL_PATH: /root/.internkim/secrets/buzz-database.env
      BUZZ_RELAY_KEY_PATH: /root/.internkim/secrets/buzz-relay.env
      BUZZ_ADMIN_COMMAND: /usr/local/bin/buzz-admin
    volumes:
      - ${HOST_STATE_DIRECTORY}/secrets:/root/.internkim/secrets:ro
      - workspace:/workspace
      - agent-state:/var/lib/internkim
      - admin-state:/root/.internkim/state
    depends_on:
      messenger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/admin/api/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 40

volumes:
  postgres-data:
  redis-data:
  media-data:
  workspace:
  agent-state:
  admin-state:
