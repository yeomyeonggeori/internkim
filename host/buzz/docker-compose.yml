name: buzz

services:
  postgres:
    image: postgres:17-alpine
    container_name: buzz-postgres
    environment:
      POSTGRES_USER: ${BUZZ_POSTGRES_USER:-buzz}
      POSTGRES_PASSWORD: ${BUZZ_POSTGRES_PASSWORD:-buzz_dev}
      POSTGRES_DB: ${BUZZ_POSTGRES_DB:-buzz}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${BUZZ_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BUZZ_POSTGRES_USER:-buzz}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: buzz-redis
    ports:
      - "${BUZZ_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: buzz-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY:-buzz_dev}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY:-buzz_dev_secret}
    volumes:
      - minio-data:/data
    ports:
      - "${BUZZ_MINIO_PORT:-9000}:9000"
      - "${BUZZ_MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: buzz-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 ${BUZZ_S3_ACCESS_KEY:-buzz_dev} ${BUZZ_S3_SECRET_KEY:-buzz_dev_secret}
      && mc mb --ignore-existing local/${BUZZ_S3_BUCKET:-buzz-media}"

  relay:
    build: .
    container_name: buzz-relay
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ../../.dependency/buzz-relay:/opt/buzz:ro
    environment:
      DATABASE_URL: postgres://${BUZZ_POSTGRES_USER:-buzz}:${BUZZ_POSTGRES_PASSWORD:-buzz_dev}@postgres:5432/${BUZZ_POSTGRES_DB:-buzz}
      REDIS_URL: redis://redis:6379
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      RELAY_URL: ${BUZZ_RELAY_URL:-ws://localhost:3000}
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY:?set BUZZ_RELAY_PRIVATE_KEY, see README.md}
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:-buzz_dev}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:-buzz_dev_secret}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      BUZZ_S3_REGION: ${BUZZ_S3_REGION:-us-east-1}
      BUZZ_MEDIA_BASE_URL: ${BUZZ_MEDIA_BASE_URL:-http://localhost:3000/media}
    ports:
      - "${BUZZ_RELAY_PORT:-3000}:3000"
      - "${BUZZ_RELAY_HEALTH_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
    name: buzz-postgres-data
  minio-data:
    name: buzz-minio-data
