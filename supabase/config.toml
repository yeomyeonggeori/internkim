project_id = "mutvimjbvmoludotyehk"

[db.seed]
enabled = true
sql_paths = ['./seed.dev.sql']

[db.network_restrictions]
enabled = true
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[db.ssl_enforcement]
enabled = false

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "https://intern.kim"
additional_redirect_urls = ["https://intern.kim/auth/claim"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_manual_linking = false
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6
password_requirements = ""

[auth.sessions]
timebox = 0
inactivity_timeout = 0

[auth.rate_limit]
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
email_sent = 2
sms_sent = 30
web3 = 30

[auth.captcha]
enabled = false
provider = "hcaptcha"

[auth.hook.custom_access_token]
enabled = false

[auth.hook.mfa_verification_attempt]
enabled = false

[auth.hook.password_verification_attempt]
enabled = false

[auth.hook.send_sms]
enabled = false

[auth.hook.send_email]
enabled = false

[auth.hook.before_user_created]
enabled = false

[auth.sms]
enable_signup = false
enable_confirmations = true
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.email.smtp]
enabled = false

[auth.email.template.magic_link]
subject = "Set up your internkim sign-in"
content_path = "./supabase/templates/magic-link.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false

[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "internkim"
rp_id = "intern.kim"
rp_origins = ["https://intern.kim"]

[auth.web3.solana]
enabled = false

[auth.web3.ethereum]
enabled = false

[auth.external.apple]
enabled = false

[auth.external.azure]
enabled = false

[auth.external.bitbucket]
enabled = false

[auth.external.discord]
enabled = false

[auth.external.facebook]
enabled = false

[auth.external.github]
enabled = false

[auth.external.gitlab]
enabled = false

[auth.external.google]
enabled = false

[auth.external.keycloak]
enabled = false

[auth.external.linkedin_oidc]
enabled = false

[auth.external.notion]
enabled = false

[auth.external.slack]
enabled = false

[auth.external.spotify]
enabled = false

[auth.external.twitch]
enabled = false

[auth.external.twitter]
enabled = false

[auth.external.x]
enabled = false

[auth.external.workos]
enabled = false

[auth.external.zoom]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = true
max_namespaces = 10
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5

[functions.setup-vapid]
verify_jwt = true

[functions.setup-digest-key]
verify_jwt = true

[functions.notify]
verify_jwt = false

[functions.announce-attendance]
verify_jwt = true

[functions.announce-task]
verify_jwt = true

[functions.announce-event-reminder]
verify_jwt = false

[functions.notify-test]
verify_jwt = true

[functions.tell-member]
verify_jwt = false
