<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f5;margin:0;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="420" cellpadding="0" cellspacing="0" border="0" style="width:420px;max-width:100%;background:#ffffff;border:1px solid #e4e4e7;border-radius:14px;">
        <tr>
          <td style="padding:32px 32px 0 32px;">
            <div style="font-size:13px;font-weight:600;letter-spacing:0.02em;color:#71717a;">김인턴</div>
            <div style="margin:12px 0 0 0;font-size:22px;line-height:1.3;font-weight:600;color:#09090b;">계정 설정하기</div>
            <div style="margin:10px 0 0 0;font-size:14px;line-height:1.6;color:#52525b;">아래 코드를 입력하거나, 이 기기에서 보고 있다면 버튼을 누르세요.</div>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 0 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fafafa;border:1px solid #e4e4e7;border-radius:10px;">
              <tr>
                <td align="center" style="padding:18px;">
                  <div style="font-size:12px;color:#71717a;">확인 코드</div>
                  <div style="margin-top:6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:30px;font-weight:600;letter-spacing:0.28em;color:#09090b;">{{ .Token }}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 0 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="background:#09090b;border-radius:8px;">
                  <a href="{{ .ConfirmationURL }}" style="display:block;padding:12px 16px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:500;">이 기기에서 계속하기</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 32px 32px;">
            <div style="font-size:12px;line-height:1.6;color:#a1a1aa;">코드와 링크는 곧 만료되고 한 번만 쓸 수 있습니다. 계정을 설정한 적이 없다면 이 메일은 그냥 두셔도 됩니다.</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
