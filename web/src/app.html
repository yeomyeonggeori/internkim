<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
		<script>
			if (['MacIntel', 'MacPPC', 'iPhone', 'iPad', 'iPod'].includes(navigator.platform)) {
				document.getElementById('app-manifest').href = '/manifest-apple.webmanifest';
			}
		</script>
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="internkim" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
		<script>
			if (window.self !== window.top) document.documentElement.classList.add('internkim-embedded');
			addEventListener(
				'error',
				(event) => {
					const source = event.target;
					if (!source || source.tagName !== 'SCRIPT' || !source.src.includes('/_app/immutable/')) return;
					if (sessionStorage.getItem('internkim-reloaded-for-release')) return;
					sessionStorage.setItem('internkim-reloaded-for-release', '1');
					location.reload();
				},
				true
			);
			addEventListener('load', () => sessionStorage.removeItem('internkim-reloaded-for-release'));
		</script>
		<script id="central-plane" type="application/json">{}</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
