[package]
name = "internkim-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "internkim_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-attendance-widget = { path = "../attendance-widget/tauri-plugin" }
tauri-plugin-page-theme = { path = "plugins/page-theme" }
tauri-plugin-keyboard = { path = "plugins/keyboard" }
tauri-plugin-haptics = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-notifications = { version = "0.5.0-rc.14", default-features = false, features = ["push-notifications"] }
