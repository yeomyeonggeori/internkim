[package]
name = "internkim-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "internkim_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-desktop-control = { path = "plugins/desktop-control" }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-attendance-widget = { path = "../attendance-widget/tauri-plugin" }
tauri-plugin-page-theme = { path = "plugins/page-theme" }
tauri-plugin-keyboard = { path = "plugins/keyboard" }
tauri-plugin-foreground-notifications = { path = "plugins/foreground-notifications" }
tauri-plugin-silent-push = { path = "plugins/silent-push" }
tauri-plugin-attendance-activity = { path = "plugins/attendance-activity" }
tauri-plugin-back-gesture = { path = "plugins/back-gesture" }
tauri-plugin-haptics = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "macos"))'.dependencies]
tauri-plugin-notifications = { version = "0.5.0-rc.16", default-features = false, features = ["push-notifications"] }
