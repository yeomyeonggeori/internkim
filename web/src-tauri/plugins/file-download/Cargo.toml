[package]
name = "tauri-plugin-file-download"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-file-download"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
incoming-file = { path = "../incoming-file" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
