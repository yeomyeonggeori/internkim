[package]
name = "tauri-plugin-foreground-notifications"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-foreground-notifications"

[dependencies]
tauri = { version = "2" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
