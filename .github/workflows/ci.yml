name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  blueclaw-pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: the pointer may only move forward, and only onto blueclaw's main
        run: |
          set -euo pipefail
          git -C .dependency/blueclaw fetch --quiet origin main
          base=$(git rev-parse "origin/${{ github.base_ref }}:.dependency/blueclaw")
          head=$(git rev-parse "HEAD:.dependency/blueclaw")
          if [ "$base" = "$head" ]; then exit 0; fi
          if ! git -C .dependency/blueclaw merge-base --is-ancestor "$base" "$head"; then
            echo "::error::.dependency/blueclaw would move backwards, $base -> $head."
            echo "::error::A rebase drops a pointer bump whose patch already appeared upstream. Redo the bump on top of the base branch."
            exit 1
          fi
          if ! git -C .dependency/blueclaw merge-base --is-ancestor "$head" origin/main; then
            echo "::error::$head is not on blueclaw's main yet; merge it there first."
            exit 1
          fi

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test tests/unit

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host/relay
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

  connection-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/connection-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase db reset
      - run: supabase test db
