name: internkim-poc-infra

networks:
  internkim-poc:
    name: internkim-poc

volumes:
  postgres-data:
  mattermost-data:

services:
  postgres:
    image: postgres:16-alpine
    networks: [internkim-poc]
    environment:
      POSTGRES_USER: internkim
      POSTGRES_PASSWORD: internkim
      POSTGRES_DB: internkim
      TENANT_COUNT: ${TENANT_COUNT:-10}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internkim"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "55432:5432"

  mattermost:
    image: mattermost/mattermost-team-edition:10.5
    networks: [internkim-poc]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://internkim:internkim@postgres:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_SERVICESETTINGS_SITEURL: "http://mattermost:8065"
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_TEAMSETTINGS_MAXUSERSPERTEAM: "200"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
      MM_TEAMSETTINGS_RESTRICTDIRECTMESSAGE: "team"
      MM_PRIVACYSETTINGS_SHOWFULLNAME: "false"
      MM_PRIVACYSETTINGS_SHOWEMAILADDRESS: "false"
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: "ERROR"
    volumes:
      - mattermost-data:/mattermost/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8065/api/v4/system/ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "8065:8065"
